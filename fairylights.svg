<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 56" width="800" height="56" role="img" aria-label="A string of twinkling fairy lights">
  <title>fairy lights</title>
  <style>
    .b1 { animation: tw 3.1s infinite ease-in-out; }
    .b2 { animation: tw 2.4s infinite ease-in-out; animation-delay: -0.8s; }
    .b3 { animation: tw 3.7s infinite ease-in-out; animation-delay: -1.9s; }
    @keyframes tw { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="56" rx="12" fill="#1b0f1e"/>

  <path d="M0,8 Q100,50 200,14 Q300,50 400,14 Q500,50 600,14 Q700,50 800,8"
        fill="none" stroke="#5b4630" stroke-width="1.6"/>

  <g class="b1"><circle cx="50"  cy="24"   r="9" fill="url(#g)"/><circle cx="50"  cy="24"   r="3" fill="#ffe2a8"/></g>
  <g class="b2"><circle cx="100" cy="31"   r="9" fill="url(#g)"/><circle cx="100" cy="31"   r="3" fill="#f7b267"/></g>
  <g class="b3"><circle cx="150" cy="27"   r="9" fill="url(#g)"/><circle cx="150" cy="27"   r="3" fill="#ffe2a8"/></g>
  <g class="b2"><circle cx="250" cy="27.5" r="9" fill="url(#g)"/><circle cx="250" cy="27.5" r="3" fill="#ffe2a8"/></g>
  <g class="b1"><circle cx="300" cy="32"   r="9" fill="url(#g)"/><circle cx="300" cy="32"   r="3" fill="#f7b267"/></g>
  <g class="b3"><circle cx="350" cy="27.5" r="9" fill="url(#g)"/><circle cx="350" cy="27.5" r="3" fill="#ffe2a8"/></g>
  <g class="b3"><circle cx="450" cy="27.5" r="9" fill="url(#g)"/><circle cx="450" cy="27.5" r="3" fill="#ffe2a8"/></g>
  <g class="b1"><circle cx="500" cy="32"   r="9" fill="url(#g)"/><circle cx="500" cy="32"   r="3" fill="#f7b267"/></g>
  <g class="b2"><circle cx="550" cy="27.5" r="9" fill="url(#g)"/><circle cx="550" cy="27.5" r="3" fill="#ffe2a8"/></g>
  <g class="b2"><circle cx="650" cy="27"   r="9" fill="url(#g)"/><circle cx="650" cy="27"   r="3" fill="#ffe2a8"/></g>
  <g class="b3"><circle cx="700" cy="31"   r="9" fill="url(#g)"/><circle cx="700" cy="31"   r="3" fill="#f7b267"/></g>
  <g class="b1"><circle cx="750" cy="24"   r="9" fill="url(#g)"/><circle cx="750" cy="24"   r="3" fill="#ffe2a8"/></g>
</svg>
